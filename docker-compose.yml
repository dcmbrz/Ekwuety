version: '3.9'

services:
  typesense:
    image: typesense/typesense:0.25.1
    container_name: ekwuety-typesense
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=ekwuety_typesense_key
      - TYPESENSE_ENABLE_CORS=true
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8108/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: ekwuety-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ekwuety-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=ekwuety
      - RABBITMQ_DEFAULT_PASS=ekwuety_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  search_api:
    build:
      context: ./apps/cloud/search_api
      dockerfile: Dockerfile
    container_name: ekwuety-search-api
    ports:
      - "8000:8000"
    environment:
      - TYPESENSE_URL=http://typesense:8108
      - TYPESENSE_API_KEY=ekwuety_typesense_key
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://ekwuety:ekwuety_secret@rabbitmq:5672
    depends_on:
      typesense:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
      - api

volumes:
  typesense_data:
  qdrant_data:
  rabbitmq_data: